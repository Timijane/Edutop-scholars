<!DOCTYPE html>
<html>
<head>
    <title>Create First Super Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #f0fdf4; }
        .box { background: white; padding: 30px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        h2 { color: #166534; margin-top: 0; }
        p { font-size: 13px; color: #666; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #16a34a; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #15803d; }
        #status { margin-top: 20px; font-weight: bold; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Create Super Admin</h2>
        <p>Enter your details. If the email already exists, we will just assign the Super Admin role to it.</p>
        
        <input type="text" id="name" placeholder="Full Name (e.g. Master Timi)">
        <input type="email" id="email" placeholder="Email Address (e.g. admin@gmail.com)">
        <input type="password" id="password" placeholder="Password (min 6 characters)">
        
        <button id="btn" onclick="setupAdmin()">Setup Super Admin</button>
        <div id="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVjXxUulSpTkxZrxpkKJrKC939PvIMKmI",
            authDomain: "aaronices.firebaseapp.com",
            projectId: "aaronices",
            storageBucket: "aaronices.firebasestorage.app",
            messagingSenderId: "355917763913",
            appId: "1:355917763913:web:c88ecd1f3f131325423698",
            measurementId: "G-7B79V1VSES"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.setupAdmin = async function() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');

            if(!name || !email || !password) {
                status.innerHTML = "❌ Please fill all fields.";
                status.style.color = "red";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerHTML = "Checking account...";
            status.style.color = "blue";

            let userUid = null;

            try {
                // Step 1: Try to log in (to see if the account already exists)
                const loginCred = await signInWithEmailAndPassword(auth, email, password);
                userUid = loginCred.user.uid;
                status.innerHTML = "Account found! Assigning Super Admin role...";
            } catch (error) {
                // If login fails (e.g., user doesn't exist), we try to create it
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    try {
                        status.innerHTML = "Creating new account...";
                        const createCred = await createUserWithEmailAndPassword(auth, email, password);
                        userUid = createCred.user.uid;
                    } catch (createErr) {
                        status.innerHTML = "❌ Error creating account: " + createErr.message;
                        status.style.color = "red";
                        btn.disabled = false;
                        btn.innerText = "Setup Super Admin";
                        return;
                    }
                } else {
                    status.innerHTML = "❌ Error: " + error.message;
                    status.style.color = "red";
                    btn.disabled = false;
                    btn.innerText = "Setup Super Admin";
                    return;
                }
            }

            // Step 2: Save to Firestore 'staff' collection
            try {
                await setDoc(doc(db, "staff", userUid), {
                    email: email.toLowerCase(),
                    name: name,
                    role: "super_admin",
                    createdAt: new Date().toISOString()
                });

                status.innerHTML = "✅ Success! You are now a Super Admin. You can log in.";
                status.style.color = "green";
                btn.innerText = "Done!";
            } catch (dbError) {
                status.innerHTML = "❌ Error saving to database: " + dbError.message;
                status.style.color = "red";
                btn.disabled = false;
                btn.innerText = "Setup Super Admin";
            }
        }
    </script>
</body>
</html>
