<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank · Aaronice Prime Edu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-page: #dcece7;          
            --bg-card: #ffffff;          
            --primary-deep: #2d6a4f;     
            --primary-teal: #52b788;     
            --primary-light: #e3f0ec;    
            --text-main: #0f172a;        
            --text-muted: #64748b;       
            --border: #e2e8f0;
            --sidebar-grad: linear-gradient(180deg, #2d6a4f 0%, #40916c 100%);
            --sidebar-active: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            display: flex; padding: 16px; gap: 16px;
            overflow-x: hidden;
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 250px; background: var(--sidebar-grad);
            border-radius: 24px; display: flex; flex-direction: column;
            padding: 24px 16px; color: #ffffff; flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(45, 106, 79, 0.15);
            height: calc(100vh - 32px); position: sticky; top: 16px;
        }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; margin-bottom: 40px; }
        .sidebar-brand .icon {
            width: 32px; height: 32px; background: #ffffff; color: var(--primary-deep);
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .sidebar-brand h1 { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            border-radius: 12px; color: rgba(255, 255, 255, 0.7); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: all 0.2s; cursor: pointer;
        }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-active); color: #ffffff; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; }

        /* ============ MAIN CONTENT ============ */
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); padding: 16px 24px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .topbar-left h2 { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: var(--primary-deep); }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        
        .search-box { position: relative; width: 300px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .search-box input {
            width: 100%; padding: 12px 16px 12px 42px; border-radius: 100px;
            border: 1px solid var(--border); background: #f8fafc; font-size: 13px;
            outline: none; transition: all 0.2s;
        }
        .search-box input:focus { border-color: var(--primary-teal); background: #ffffff; box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.1); }

        .card {
            background: var(--bg-card); border-radius: 20px; padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .card-title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; }

        .btn {
            padding: 10px 20px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--primary-deep); color: #ffffff; }
        .btn-primary:hover { background: #1b4332; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #f8fafc; }

        /* ============ QUESTION LIST ============ */
        .question-list { display: flex; flex-direction: column; gap: 16px; }
        
        .q-item {
            border: 1px solid var(--border); border-radius: 12px; padding: 20px;
            transition: all 0.2s; background: #ffffff;
        }
        .q-item:hover { border-color: var(--primary-teal); box-shadow: 0 4px 12px rgba(82,183,136,0.08); }
        
        .q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 16px; }
        .q-text { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.5; flex: 1; }
        
        .q-actions { display: flex; gap: 8px; }
        .q-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: #f8fafc; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .q-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
        
        .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .q-opt { font-size: 13px; color: var(--text-muted); display: flex; gap: 8px; }
        .q-opt.correct { color: var(--primary-deep); font-weight: 600; }
        .q-opt.correct::after { content: '\f00c'; font-family: 'FontAwesome'; font-size: 11px; }
        
        .q-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tag {
            background: var(--primary-light); color: var(--primary-deep);
            padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
        }

        /* ============ MODALS ============ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card); padding: 32px; border-radius: 20px;
            max-width: 700px; width: 100%; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.3s ease; max-height: 90vh; overflow-y: auto;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-close { position: absolute; top: 20px; right: 24px; font-size: 24px; color: var(--text-muted); cursor: pointer; background: none; border: none; }
        .modal-content h3 { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; color: var(--primary-deep); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px 16px; font-size: 14px; border: 1px solid var(--border);
            border-radius: 10px; outline: none; font-family: 'Inter', sans-serif;
        }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .form-control:focus { border-color: var(--primary-teal); box-shadow: 0 0 0 3px rgba(82,183,136,0.1); }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .opt-group { display: flex; align-items: center; gap: 12px; }
        .opt-group input[type="radio"] { accent-color: var(--primary-deep); width: 18px; height: 18px; cursor: pointer; }
        .opt-group .form-control { flex: 1; }

        /* Course Multi-Select */
        .course-select-box {
            border: 1px solid var(--border); border-radius: 10px;
            max-height: 150px; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 8px; background: #f8fafc;
        }
        .course-check { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; padding: 4px; border-radius: 6px; }
        .course-check:hover { background: #f1f5f9; }
        .course-check input { accent-color: var(--primary-teal); width: 16px; height: 16px; cursor: pointer; }

        /* CSV Dropzone */
        .dropzone {
            border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px;
            text-align: center; cursor: pointer; transition: all 0.2s; background: #f8fafc; margin-bottom: 16px;
        }
        .dropzone:hover { border-color: var(--primary-teal); background: var(--primary-light); }
        .dropzone i { font-size: 32px; color: var(--primary-teal); margin-bottom: 12px; }
        .dropzone p { font-size: 13px; color: var(--text-muted); }

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 40px; color: var(--border); margin-bottom: 16px; }

        @media (max-width: 992px) {
            body { flex-direction: column; padding: 10px; }
            .sidebar { width: 100%; height: auto; position: relative; top: 0; flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 20px; }
            .sidebar-brand { margin-bottom: 0; }
            .nav-menu { flex-direction: row; gap: 4px; overflow-x: auto; width: auto; flex: none; }
            .nav-item { padding: 10px; }
            .nav-item span { display: none; }
            .nav-bottom { display: none; }
            .options-grid { grid-template-columns: 1fr; }
            .search-box { width: 200px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="icon"><i class="fas fa-graduation-cap"></i></div>
            <h1>Admin Panel</h1>
        </div>
        <nav class="nav-menu">
            <a href="admin-dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i> <span>Dashboard</span>
            </a>
            <a href="admin-students.html" class="nav-item">
                <i class="fas fa-users"></i> <span>Students & Courses</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-file-alt"></i> <span>Exams</span>
            </a>
            <a href="#" class="nav-item active">
                <i class="fas fa-question-circle"></i> <span>Question Bank</span>
            </a>
        </nav>
        <div class="nav-bottom">
            <a href="index.html" class="nav-item">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        
        <header class="topbar">
            <div class="topbar-left">
                <h2>Question Bank</h2>
            </div>
            <div class="topbar-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search questions..." oninput="filterQuestions()">
                </div>
            </div>
        </header>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">All Questions (<span id="questionCount">0</span>)</h3>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-outline" onclick="openModal('csvModal')">
                        <i class="fas fa-file-upload"></i> Bulk Import
                    </button>
                    <button class="btn btn-primary" onclick="openQuestionModal()">
                        <i class="fas fa-plus"></i> Create Question
                    </button>
                </div>
            </div>

            <div class="question-list" id="questionList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading questions...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- ================= CREATE QUESTION MODAL ================= -->
    <div class="modal" id="questionModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('questionModal')">&times;</button>
            <h3>Create New Question</h3>
            
            <div class="form-group">
                <label>Question Text</label>
                <textarea id="qText" class="form-control" placeholder="Type the question here..."></textarea>
            </div>

            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:10px;">Options (Select the correct answer)</label>
            <div class="options-grid">
                <div class="opt-group">
                    <input type="radio" name="correctOpt" value="A" checked>
                    <input type="text" id="qOptA" class="form-control" placeholder="Option A">
                </div>
                <div class="opt-group">
                    <input type="radio" name="correctOpt" value="B">
                    <input type="text" id="qOptB" class="form-control" placeholder="Option B">
                </div>
                <div class="opt-group">
                    <input type="radio" name="correctOpt" value="C">
                    <input type="text" id="qOptC" class="form-control" placeholder="Option C">
                </div>
                <div class="opt-group">
                    <input type="radio" name="correctOpt" value="D">
                    <input type="text" id="qOptD" class="form-control" placeholder="Option D">
                </div>
            </div>

            <div class="form-group" style="margin-top:16px;">
                <label>Link to Courses (Select all that apply)</label>
                <div class="course-select-box" id="courseCheckboxList">
                    <!-- Populated via JS -->
                    <p style="font-size:12px; color:var(--text-muted);">Loading courses...</p>
                </div>
            </div>

            <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:16px;" id="saveQuestionBtn" onclick="saveQuestion()">
                Save Question
            </button>
        </div>
    </div>

    <!-- ================= CSV UPLOAD MODAL ================= -->
    <div class="modal" id="csvModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('csvModal')">&times;</button>
            <h3>Bulk Import Questions</h3>
            
            <button class="btn btn-outline" style="width:100%; justify-content:center; margin-bottom:20px;" onclick="downloadCSVTemplate()">
                <i class="fas fa-download"></i> Download CSV Template
            </button>

            <div class="dropzone" onclick="document.getElementById('csvFileInput').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Click to select a CSV file or drag and drop here</p>
                <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
            </div>
            
            <div id="csvStatus" style="font-size:13px; font-weight:600; text-align:center;"></div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCVjXxUulSpTkxZrxpkKJrKC939PvIMKmI",
  authDomain: "aaronices.firebaseapp.com",
  projectId: "aaronices",
  storageBucket: "aaronices.firebasestorage.app",
  messagingSenderId: "355917763913",
  appId: "1:355917763913:web:c88ecd1f3f131325423698",
  measurementId: "G-7B79V1VSES"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allQuestions = [];
        let availableCourses = [];
        let currentUserEmail = "";

        // --- SECURITY: HTML ESCAPER (Prevents XSS) ---
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // --- UI HELPERS ---
        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        // --- AUTH & INITIAL LOAD ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUserEmail = user.email;

            await loadCourses();
            await loadQuestions();
        });

        // --- LOAD COURSES (For Tagging) ---
        async function loadCourses() {
            const listDiv = document.getElementById('courseCheckboxList');
            try {
                const snap = await getDocs(collection(db, "courses"));
                availableCourses = [];
                let html = '';
                
                snap.forEach(doc => {
                    const c = doc.data();
                    availableCourses.push(c.code);
                    html += `
                        <label class="course-check">
                            <input type="checkbox" value="${escapeHTML(c.code)}" class="course-cb">
                            <span>${escapeHTML(c.code)} - ${escapeHTML(c.title)}</span>
                        </label>
                    `;
                });

                listDiv.innerHTML = html || '<p style="font-size:12px; color:var(--text-muted);">No courses found. Add courses first.</p>';
            } catch (e) {
                console.error(e);
                listDiv.innerHTML = '<p style="font-size:12px; color:red;">Error loading courses.</p>';
            }
        }

        // --- LOAD QUESTIONS ---
        async function loadQuestions() {
            const container = document.getElementById('questionList');
            try {
                const snap = await getDocs(collection(db, "questions"));
                allQuestions = [];
                snap.forEach(doc => {
                    allQuestions.push({ id: doc.id, ...doc.data() });
                });

                // Sort newest first
                allQuestions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderQuestions(allQuestions);
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#dc2626;"></i><p>Error loading questions.</p></div>';
            }
        }

        // --- RENDER QUESTIONS ---
        function renderQuestions(questions) {
            const container = document.getElementById('questionList');
            document.getElementById('questionCount').textContent = questions.length;

            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No questions found in the bank yet.</p>
                    </div>`;
                return;
            }

            let html = '';
            questions.forEach(q => {
                let optsHtml = '';
                ['A', 'B', 'C', 'D'].forEach(letter => {
                    const isCorrect = q.correctAnswer === letter;
                    optsHtml += `
                        <div class="q-opt ${isCorrect ? 'correct' : ''}">
                            <strong>${letter}.</strong> ${escapeHTML(q.options[letter] || '—')}
                        </div>
                    `;
                });

                const tagsHtml = q.courseIds.map(c => `<span class="tag">${escapeHTML(c)}</span>`).join('');

                html += `
                    <div class="q-item" data-text="${escapeHTML(q.text.toLowerCase())}">
                        <div class="q-header">
                            <div class="q-text">${escapeHTML(q.text)}</div>
                            <div class="q-actions">
                                <button class="q-btn" onclick="deleteQuestion('${q.id}')" title="Delete Question">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="q-options">${optsHtml}</div>
                        <div class="q-tags">
                            <i class="fas fa-tags" style="color:var(--text-muted); font-size:12px;"></i>
                            ${tagsHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- SEARCH FILTER ---
        window.filterQuestions = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allQuestions.filter(q => 
                q.text.toLowerCase().includes(term) || 
                q.courseIds.some(c => c.toLowerCase().includes(term))
            );
            renderQuestions(filtered);
        };

        // --- SAVE NEW QUESTION ---
        window.saveQuestion = async () => {
            const text = document.getElementById('qText').value.trim();
            const optA = document.getElementById('qOptA').value.trim();
            const optB = document.getElementById('qOptB').value.trim();
            const optC = document.getElementById('qOptC').value.trim();
            const optD = document.getElementById('qOptD').value.trim();
            const correctAnswer = document.querySelector('input[name="correctOpt"]:checked').value;
            
            const courseIds = Array.from(document.querySelectorAll('.course-cb:checked')).map(cb => cb.value);

            if (!text || !optA || !optB || !optC || !optD) {
                alert("Please fill in the question text and all 4 options.");
                return;
            }
            if (courseIds.length === 0) {
                alert("Please link this question to at least one course.");
                return;
            }

            const btn = document.getElementById('saveQuestionBtn');
            btn.textContent = "Saving..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "questions"), {
                    text: text,
                    options: { A: optA, B: optB, C: optC, D: optD },
                    correctAnswer: correctAnswer,
                    courseIds: courseIds,
                    createdBy: currentUserEmail,
                    createdAt: new Date().toISOString()
                });

                // Reset form
                document.getElementById('qText').value = '';
                document.getElementById('qOptA').value = '';
                document.getElementById('qOptB').value = '';
                document.getElementById('qOptC').value = '';
                document.getElementById('qOptD').value = '';
                document.querySelector('input[name="correctOpt"][value="A"]').checked = true;
                document.querySelectorAll('.course-cb:checked').forEach(cb => cb.checked = false);

                closeModal('questionModal');
                loadQuestions(); 

            } catch (error) {
                console.error(error);
                alert("Error saving question: " + error.message);
            } finally {
                btn.textContent = "Save Question"; btn.disabled = false;
            }
        };

        // --- DELETE QUESTION ---
        window.deleteQuestion = async (id) => {
            if (!confirm("Are you sure you want to delete this question? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, "questions", id));
                loadQuestions();
            } catch (error) {
                alert("Error deleting: " + error.message);
            }
        };

        // --- CSV TEMPLATE ---
        window.downloadCSVTemplate = () => {
            const csvContent = "Question,Option A,Option B,Option C,Option D,Correct Answer,Courses\nWhat is 2+2?,1,2,3,4,B,MTH101|GST101\nWho is the president?,Buhari,Tinubu,Jonathan,Obasanjo,B,GST101";
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'question_template.csv'; a.click();
        };

        // --- CSV UPLOAD (BATCH WRITE - ENTERPRISE GRADE) ---
        window.handleCSVUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('csvStatus');
            statusDiv.textContent = "Parsing file...";
            statusDiv.style.color = "var(--primary-deep)";

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    const rows = results.data;
                    if (rows.length === 0) { statusDiv.textContent = "File is empty."; return; }

                    statusDiv.textContent = `Processing ${rows.length} questions...`;

                    let success = 0;
                    let fail = 0;
                    let batch = writeBatch(db); // Initialize Firestore Batch
                    let batchCount = 0;

                    for (const row of rows) {
                        try {
                            const text = row['Question'];
                            const optA = row['Option A'];
                            const optB = row['Option B'];
                            const optC = row['Option C'];
                            const optD = row['Option D'];
                            const correct = row['Correct Answer'];
                            const coursesStr = row['Courses'];

                            if (!text || !optA || !optB || !optC || !optD || !correct || !coursesStr) {
                                fail++; continue;
                            }

                            const courseIds = coursesStr.split('|').map(s => s.trim().toUpperCase());
                            
                            // Create a new document reference
                            const newDocRef = doc(collection(db, "questions"));
                            
                            // Add to batch instead of sending immediately
                            batch.set(newDocRef, {
                                text: text,
                                options: { A: optA, B: optB, C: optC, D: optD },
                                correctAnswer: correct.trim().toUpperCase(),
                                courseIds: courseIds,
                                createdBy: currentUserEmail,
                                createdAt: new Date().toISOString()
                            });
                            
                            success++;
                            batchCount++;

                            // Firestore limits batches to 500 operations. Commit and reset if we hit the limit.
                            if (batchCount === 500) {
                                await batch.commit();
                                batch = writeBatch(db); // Start a new batch
                                batchCount = 0;
                            }

                        } catch (err) {
                            fail++;
                        }
                    }

                    // Commit any remaining questions in the final batch
                    if (batchCount > 0) {
                        await batch.commit();
                    }

                    statusDiv.textContent = `Upload Complete! Success: ${success}, Failed: ${fail}`;
                    statusDiv.style.color = success > 0 ? "var(--primary-teal)" : "red";
                    loadQuestions();
                }
            });
        };
    </script>
</body>
</html>
