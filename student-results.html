<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results · Aaronice Prime Edu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --white: #ffffff;
            --green-50: #f5fdf8;
            --green-100: #e8f9ee;
            --green-200: #c6efd3;
            --green-600: #16a34a;
            --green-700: #15803d;
            
            --ink-900: #0b1220;
            --ink-700: #334155;
            --ink-500: #64748b;
            --line: #e8eaed;
            --line-soft: #f1f3f5;
            
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(11, 18, 32, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--ink-900);
            background: linear-gradient(180deg, var(--green-50) 0%, var(--green-100) 180px, var(--white) 480px, var(--white) 100%);
            min-height: 100vh;
            line-height: 1.5;
            font-size: 14px;
        }

        /* ============ TOP BAR ============ */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .topbar-inner {
            max-width: 1000px; margin: 0 auto; padding: 0 20px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; text-decoration: none; color: var(--ink-900); }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-text strong { font-size: 14px; font-weight: 700; }
        .brand-text span { font-size: 10.5px; color: var(--ink-500); font-weight: 500; }
        
        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--ink-700); text-decoration: none; font-weight: 600; font-size: 13px;
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--white); transition: all 0.2s;
        }
        .btn-back:hover { background: var(--line-soft); color: var(--ink-900); }

        /* ============ MAIN ============ */
        .main { max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }
        
        .page-head { margin-bottom: 24px; }
        .page-head h1 { font-size: 24px; font-weight: 700; color: var(--ink-900); margin-bottom: 4px; }
        .page-head p { font-size: 14px; color: var(--ink-500); }

        /* ============ SUMMARY STATS ============ */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .summary-card {
            background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg);
            padding: 20px; position: relative; overflow: hidden;
        }
        .summary-card::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--green-600); }
        .summary-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-500); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .summary-card .label i { color: var(--green-600); }
        .summary-card .value { font-size: 26px; font-weight: 700; color: var(--ink-900); line-height: 1.1; }
        .summary-card .value small { font-size: 14px; color: var(--ink-500); }

        /* ============ RESULTS LIST ============ */
        .results-container {
            background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .result-header {
            padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
            font-size: 15px; font-weight: 700; color: var(--ink-900);
            display: flex; align-items: center; gap: 8px;
        }
        .result-header i { color: var(--green-600); }

        .result-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border-bottom: 1px solid var(--line-soft);
            transition: background 0.15s;
        }
        .result-row:last-child { border-bottom: none; }
        .result-row:hover { background: var(--green-50); }

        .result-info h3 { font-size: 15px; font-weight: 600; color: var(--ink-900); margin-bottom: 4px; }
        .result-info .meta { display: flex; gap: 12px; font-size: 12px; color: var(--ink-500); }
        .result-info .meta span { display: flex; align-items: center; gap: 4px; }

        .result-score { text-align: right; display: flex; align-items: center; gap: 20px; }
        .score-big { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 700; line-height: 1; }
        .score-big.pass { color: var(--green-600); }
        .score-big.fail { color: var(--danger); }
        
        .status-badge {
            padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .status-badge.pass { background: var(--green-100); color: var(--green-700); border: 1px solid var(--green-200); }
        .status-badge.fail { background: var(--danger-soft); color: #991b1b; border: 1px solid #fecaca; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-500); }
        .empty-state i { font-size: 48px; color: var(--line); margin-bottom: 16px; }
        .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--ink-900); margin-bottom: 8px; }
        .empty-state p { font-size: 13px; }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: 1fr; }
            .result-row { flex-direction: column; align-items: flex-start; gap: 16px; }
            .result-score { width: 100%; justify-content: space-between; text-align: left; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar-inner">
            <a href="dashboard.html" class="brand">
                <div class="brand-text">
                    <strong>Aaronice Prime Edu</strong>
                    <span>Exam Results</span>
                </div>
            </a>
            <a href="dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </header>

    <main class="main">
        <div class="page-head">
            <h1>My Exam Results</h1>
            <p>View your published scores and performance across all courses.</p>
        </div>

        <!-- SUMMARY STATS -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="label"><i class="fas fa-file-alt"></i> Total Exams</div>
                <div class="value" id="summaryTotal">0</div>
            </div>
            <div class="summary-card">
                <div class="label"><i class="fas fa-chart-line"></i> Average Score</div>
                <div class="value" id="summaryAvg">0<small>%</small></div>
            </div>
            <div class="summary-card">
                <div class="label"><i class="fas fa-trophy"></i> Best Score</div>
                <div class="value" id="summaryBest">0<small>%</small></div>
            </div>
        </div>

        <!-- RESULTS LIST -->
        <div class="results-container">
            <div class="result-header">
                <i class="fas fa-check-circle"></i> Published Results
            </div>
            <div id="resultsList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading Results...</h3>
                    <p>Please wait while we fetch your scores.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCVjXxUulSpTkxZrxpkKJrKC939PvIMKmI",
            authDomain: "aaronices.firebaseapp.com",
            projectId: "aaronices",
            storageBucket: "aaronices.firebasestorage.app",
            messagingSenderId: "355917763913",
            appId: "1:355917763913:web:c88ecd1f3f131325423698",
            measurementId: "G-7B79V1VSES"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const $ = (sel) => document.querySelector(sel);
        const esc = (s = '') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

        // 1. Check Auth State
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            await loadResults(user.uid);
        });

        // 2. Load Published Results
        async function loadResults(uid) {
            const container = $('#resultsList');
            try {
                // Query attempts where studentUid matches AND isPublished is true
                const q = query(
                    collection(db, "attempts"),
                    where("studentUid", "==", uid),
                    where("isPublished", "==", true)
                );
                
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-file-excel"></i>
                            <h3>No Published Results Yet</h3>
                            <p>Your results will appear here once the exam administrator publishes them.</p>
                        </div>
                    `;
                    return;
                }

                // Parse results
                let results = [];
                snap.forEach(doc => {
                    results.push({ id: doc.id, ...doc.data() });
                });

                // Sort by newest first
                results.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                // Calculate Stats
                let total = results.length;
                let sum = 0;
                let best = 0;

                results.forEach(r => {
                    sum += Number(r.percentage || 0);
                    if (Number(r.percentage) > best) best = Number(r.percentage);
                });

                let avg = Math.round(sum / total);

                // Update Summary Cards
                $('#summaryTotal').textContent = total;
                $('#summaryAvg').innerHTML = `${avg}<small>%</small>`;
                $('#summaryBest').innerHTML = `${best}<small>%</small>`;

                // Render List
                let html = '';
                results.forEach(r => {
                    const date = new Date(r.submittedAt).toLocaleDateString('en-GB', { 
                        day: 'numeric', month: 'short', year: 'numeric' 
                    });
                    const isPass = r.percentage >= 50;
                    const statusClass = isPass ? 'pass' : 'fail';
                    const statusText = isPass ? 'Pass' : 'Fail';

                    html += `
                        <div class="result-row">
                            <div class="result-info">
                                <h3>${esc(r.courseId)} - ${esc(r.examTitle)}</h3>
                                <div class="meta">
                                    <span><i class="fas fa-calendar"></i> ${date}</span>
                                    <span><i class="fas fa-check-circle"></i> ${r.score} / ${r.totalQuestions} correct</span>
                                </div>
                            </div>
                            <div class="result-score">
                                <div class="score-big ${statusClass}">${r.percentage}%</div>
                                <div class="status-badge ${statusClass}">${statusText}</div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error("Error loading results:", error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
                        <h3>Error Loading Results</h3>
                        <p>There was a problem fetching your results. Please try again later.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
